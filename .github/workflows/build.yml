name: build

# Bump an addon's version in its addon.xml and push: this publishes it.
# Static checks, then a refreshed Kodi repository index (which is what makes
# Kodi itself offer the update) and a Release per new addon version.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    # Kodi 21 embeds Python 3.8, so compile against that rather than whatever
    # the runner defaults to. 3.8 is only available on the 22.04 image.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: static checks
        run: python tools/check_static.py

      - name: build repository tree
        run: python tools/make_repo.py --out "$RUNNER_TEMP/repo"

      - uses: actions/upload-artifact@v4
        with:
          name: addons
          path: ${{ runner.temp }}/repo
          if-no-files-found: error

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: build repository tree
        run: |
          base="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/"
          python tools/make_repo.py --out "$RUNNER_TEMP/repo" --base-url "$base"

      - name: publish repository index to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep whatever is already published so older versions stay installable.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add "$RUNNER_TEMP/pages" gh-pages
          else
            git worktree add --detach "$RUNNER_TEMP/pages"
            git -C "$RUNNER_TEMP/pages" checkout --orphan gh-pages
            git -C "$RUNNER_TEMP/pages" rm -rf . >/dev/null 2>&1 || true
          fi
          cp -r "$RUNNER_TEMP/repo/." "$RUNNER_TEMP/pages/"
          touch "$RUNNER_TEMP/pages/.nojekyll"
          git -C "$RUNNER_TEMP/pages" add -A
          if git -C "$RUNNER_TEMP/pages" diff --cached --quiet; then
            echo "repository index unchanged"
          else
            git -C "$RUNNER_TEMP/pages" commit -m "repository: ${GITHUB_SHA:0:7}"
            git -C "$RUNNER_TEMP/pages" push origin gh-pages
          fi

      - name: release every new addon version
        run: |
          # The zip is named <id>-<version>.zip, which is also the tag, so a
          # version that is already released simply finds its tag and is skipped.
          for zip in "$RUNNER_TEMP"/repo/*/*.zip; do
            tag=$(basename "$zip" .zip)
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already released"
              continue
            fi
            gh release create "$tag" "$zip" --title "$tag" \
              --notes "先装一次 repository.kodiaddons zip，之后 Kodi 会自动提示更新；也可以直接装这个 zip，但手动装的插件不会自动更新。"
          done
