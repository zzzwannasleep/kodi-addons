<h1>UHD Kodi 仓库</h1>
<p>当前版本：<b>1.0.1</b></p>
<h2>自动更新（推荐）</h2>
<ol>
<li>下载 <a href="repository.uhd/repository.uhd-1.1.0.zip">repository.uhd-1.1.0.zip</a></li>
<li>Kodi → 插件 → 从 zip 文件安装 → 选中它</li>
<li>之后在「从存储库安装」里找到 UHD，日后更新由 Kodi 自动提示</li>
</ol>
<h2>手动安装</h2>
<p>直接装 <a href="plugin.video.uhd/plugin.video.uhd-1.0.1.zip">plugin.video.uhd-1.0.1.zip</a>，以后需要自己重装新版。</p>
<p>装完在插件设置里填服务器地址与账号。仓库不包含任何地址或凭据。</p>
<p><code>https://zzzwannasleep.github.io/plugin.video.uhd/</code></p>
