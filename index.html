<h1>Kodi 插件库</h1>
<h2>自动更新（推荐）</h2>
<ol>
<li>下载 <a href="repository.kodiaddons/repository.kodiaddons-2.0.0.zip">repository.kodiaddons-2.0.0.zip</a></li>
<li>Kodi → 插件 → 从 zip 文件安装 → 选中它</li>
<li>之后在「从存储库安装」里装插件，日后更新由 Kodi 自动提示</li>
</ol>
<h2>直接下载</h2>
<table><tr><th>插件</th><th>版本</th><th>zip</th></tr>
<tr><td>UHD</td><td>1.0.2</td><td><a href="plugin.video.uhd/plugin.video.uhd-1.0.2.zip">plugin.video.uhd-1.0.2.zip</a></td></tr>
</table>
<p>手动装的插件不会自动更新，升级要自己重装。插件里的地址与账号在各自的设置中填写，本仓库不含任何地址或凭据。</p>
<p><code>https://zzzwannasleep.github.io/kodi-addons/</code></p>
